<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=Barlow:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  @keyframes riseIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="position:relative;width:100%;min-height:100vh;padding:clamp(14px,1.6vw,22px);background:#0a1120;font-family:'Barlow',sans-serif">

  <div style="position:relative;width:100%;height:calc(100vh - clamp(28px,3.2vw,44px));min-height:660px;border-radius:26px;overflow:hidden;background:#0a1120">

    <!-- background photo -->
    <div style="position:absolute;inset:0;background-image:url('assets/jahorina-hero.jpg');background-size:cover;background-position:center 40%"></div>
    <!-- scrims: darken left for headline + bottom for cards -->
    <div style="position:absolute;inset:0;background:linear-gradient(100deg, rgba(6,11,22,.72) 0%, rgba(6,11,22,.40) 34%, rgba(6,11,22,0) 62%)"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(0deg, rgba(6,11,22,.70) 0%, rgba(6,11,22,0) 42%)"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(6,11,22,.35) 0%, rgba(6,11,22,0) 22%)"></div>

    <!-- ===== HEADER ===== -->
    <header style="position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:28px;padding:clamp(22px,2.4vw,34px) clamp(24px,3vw,46px);animation:fadeIn 1s ease both">
      <img src="assets/logo-white-lockup.png" alt="Jahorina — Olimpijski centar" style="height:46px;width:auto;display:block">

      <nav style="display:flex;align-items:center;gap:clamp(20px,2.4vw,40px)">
        <div style="position:relative">
          <a href="#" onClick="{{ toggleONama }}" style="display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:500;color:rgba(255,255,255,.9);text-decoration:none;transition:color .2s;cursor:pointer" style-hover="color:#fff">
            O nama
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="{{ oNamaChevronStyle }}"><path d="M6 9 L12 15 L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <sc-if value="{{ oNamaOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:calc(100% + 16px);left:0;min-width:200px;background:rgba(14,20,34,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:14px;box-shadow:0 24px 48px -16px rgba(0,0,0,.6);overflow:hidden;z-index:20;animation:cardIn .25s cubic-bezier(.2,.7,.2,1) both">
              <a href="#" style="display:block;padding:13px 20px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.88);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08);transition:background .15s" style-hover="background:rgba(255,255,255,.08);color:#fff">Istorija centra</a>
              <a href="#" style="display:block;padding:13px 20px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.88);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08);transition:background .15s" style-hover="background:rgba(255,255,255,.08);color:#fff">Naš tim</a>
              <a href="#" style="display:block;padding:13px 20px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.88);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08);transition:background .15s" style-hover="background:rgba(255,255,255,.08);color:#fff">Galerija</a>
              <a href="#" style="display:block;padding:13px 20px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.88);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08);transition:background .15s" style-hover="background:rgba(255,255,255,.08);color:#fff">Nagrade</a>
              <a href="#" style="display:block;padding:13px 20px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.88);text-decoration:none;transition:background .15s" style-hover="background:rgba(255,255,255,.08);color:#fff">Kontakt info</a>
            </div>
          </sc-if>
        </div>
        <a href="#" style="font-size:16px;font-weight:500;color:rgba(255,255,255,.9);text-decoration:none;transition:color .2s" style-hover="color:#fff">Cjenovnik</a>
        <a href="#" style="font-size:16px;font-weight:500;color:rgba(255,255,255,.9);text-decoration:none;transition:color .2s" style-hover="color:#fff">Vijesti</a>
        <a href="#" style="font-size:16px;font-weight:500;color:rgba(255,255,255,.9);text-decoration:none;transition:color .2s" style-hover="color:#fff">Kontakt</a>
      </nav>

      <div style="display:flex;align-items:center;gap:12px">
        <a href="#" style="display:inline-flex;align-items:center;gap:9px;padding:12px 24px;background:rgba(255,255,255,.10);color:#fff;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;letter-spacing:.3px;text-decoration:none;border:1.5px solid rgba(255,255,255,.5);border-radius:40px;backdrop-filter:blur(6px);white-space:nowrap;transition:background .2s,border-color .2s" style-hover="background:rgba(255,255,255,.2);border-color:#fff">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M6.5 2.5 L2 4.5 V15.5 L6.5 13.5 L11.5 15.5 L16 13.5 V2.5 L11.5 4.5 Z" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"></path><line x1="6.5" y1="2.5" x2="6.5" y2="13.5" stroke="#fff" stroke-width="1.4"></line><line x1="11.5" y1="4.5" x2="11.5" y2="15.5" stroke="#fff" stroke-width="1.4"></line></svg>
          Ski mapa
        </a>
        <a href="#" style="display:inline-flex;align-items:center;gap:9px;padding:13px 26px;background:#fff;color:#0d1524;font-family:'Barlow',sans-serif;font-size:15px;font-weight:700;letter-spacing:.3px;text-decoration:none;border-radius:40px;transition:transform .2s,box-shadow .2s" style-hover="transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(0,0,0,.6)">Web shop <span style="font-size:16px">→</span></a>
      </div>
    </header>

    <!-- ===== HEADLINE ===== -->
    <div style="position:absolute;left:clamp(24px,3vw,52px);top:clamp(150px,25%,240px);z-index:5">
      <div style="font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;letter-spacing:5px;color:rgba(255,255,255,.75);text-transform:uppercase;margin-bottom:20px;animation:riseIn .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:.1s">OLIMPIJSKI CENTAR JAHORINA</div>
      <h1 style="margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(52px,8.4vw,132px);line-height:.94;letter-spacing:-1px;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.4)">
        <span style="display:block;animation:riseIn .85s cubic-bezier(.2,.7,.2,1) both;animation-delay:.2s">Otkrij</span>
        <span style="display:block;animation:riseIn .85s cubic-bezier(.2,.7,.2,1) both;animation-delay:.32s">čaroliju</span>
        <span style="display:block;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.92);animation:riseIn .85s cubic-bezier(.2,.7,.2,1) both;animation-delay:.44s">Jahorine</span>
      </h1>
    </div>

    <!-- ===== BOTTOM-LEFT: opis + ocjena ===== -->
    <div style="position:absolute;left:clamp(24px,3vw,52px);bottom:clamp(26px,3.4vw,46px);z-index:5;max-width:400px;display:flex;align-items:flex-end;gap:26px;animation:fadeIn 1.1s ease both;animation-delay:.6s">
      <p style="margin:0;font-size:clamp(14px,1.05vw,16px);line-height:1.55;color:rgba(255,255,255,.82)">Olimpijske staze, noćno skijanje i vrhunsko gostoprimstvo — doživi zimu na najpoznatijoj planini regije.</p>
      <sc-if value="{{ showRating }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:8px;white-space:nowrap">
          <span style="color:#f5b638;font-size:20px;line-height:1">★</span>
          <span style="font-family:'Archivo',sans-serif;font-weight:700;font-size:22px;color:#fff">4.8</span>
        </div>
      </sc-if>
    </div>

    <!-- ===== QUICK-LINK ICON ROW ===== -->
    <sc-if value="{{ showQuickLinks }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;right:clamp(24px,3vw,52px);bottom:clamp(26px,3.4vw,46px);z-index:6;display:flex;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 40px -18px rgba(0,0,0,.55);animation:cardIn .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:.55s">

        <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:clamp(70px,6vw,84px);height:clamp(74px,6.2vw,88px);text-decoration:none;background:transparent;border-right:1px solid rgba(255,255,255,.22);transition:background .2s" style-hover="background:rgba(255,255,255,.14)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 16 H21 M6 16 V10 L12 5 L18 10 V16" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"></path><circle cx="12" cy="5" r="1.4" fill="#fff"></circle></svg>
          <span style="font-family:'Archivo',sans-serif;font-weight:700;font-size:11px;color:#fff">0/18</span>
        </a>

        <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:clamp(70px,6vw,84px);height:clamp(74px,6.2vw,88px);text-decoration:none;background:transparent;border-right:1px solid rgba(255,255,255,.22);transition:background .2s" style-hover="background:rgba(255,255,255,.14)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 20 L18 6 M18 6 H12 M18 6 V12" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span style="font-family:'Archivo',sans-serif;font-weight:700;font-size:11px;color:#fff">0/5</span>
        </a>

        <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:clamp(70px,6vw,84px);height:clamp(74px,6.2vw,88px);text-decoration:none;background:transparent;border-right:1px solid rgba(255,255,255,.22);transition:background .2s" style-hover="background:rgba(255,255,255,.14)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><line x1="7" y1="5" x2="7" y2="19" stroke="#fff" stroke-width="1.5"></line><line x1="12" y1="5" x2="12" y2="19" stroke="#fff" stroke-width="1.5"></line><line x1="17" y1="5" x2="17" y2="19" stroke="#fff" stroke-width="1.5"></line></svg>
          <span style="font-family:'Archivo',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.3px;color:#fff">ŠKOLA</span>
        </a>

        <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:clamp(70px,6vw,84px);height:clamp(74px,6.2vw,88px);text-decoration:none;background:var(--accent, #00B9F2);border-right:1px solid rgba(255,255,255,.22);transition:filter .2s" style-hover="filter:brightness(1.1)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12 a8 8 0 0 1 14-5.3 M20 12 a8 8 0 0 1-14 5.3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"></path><path d="M18 5 v3 h-3 M6 19 v-3 h3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span style="font-family:'Archivo',sans-serif;font-weight:700;font-size:11px;color:#fff">360°</span>
        </a>

        <a href="#" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:clamp(70px,6vw,84px);height:clamp(74px,6.2vw,88px);text-decoration:none;background:transparent;transition:background .2s" style-hover="background:rgba(255,255,255,.14)">
          <span style="position:absolute;top:14px;right:16px;width:7px;height:7px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 3px rgba(255,77,77,.25)"></span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="14" height="11" rx="1.6" stroke="#fff" stroke-width="1.5"></rect><path d="M17 9.5 L21 7 V16 L17 13.5" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"></path></svg>
          <span style="font-family:'Archivo',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.3px;color:#fff">UŽIVO</span>
        </a>

      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 820 },
  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#00B9F2&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;showQuickLinks&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;showRating&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  state = { oNamaOpen: false };

  componentDidMount() {
    this._onDocClick = () => { if (this.state.oNamaOpen) this.setState({ oNamaOpen: false }); };
    document.addEventListener('click', this._onDocClick);
  }

  componentWillUnmount() {
    document.removeEventListener('click', this._onDocClick);
  }

  renderVals() {
    return {
      accent: this.props.accentColor ?? '#00B9F2',
      showQuickLinks: this.props.showQuickLinks ?? true,
      showRating: this.props.showRating ?? true,
      oNamaOpen: this.state.oNamaOpen,
      oNamaChevronStyle: { transform: this.state.oNamaOpen ? 'rotate(180deg)' : 'none', transition: 'transform .2s' },
      toggleONama: (e) => { e.preventDefault(); e.stopPropagation(); this.setState(s => ({ oNamaOpen: !s.oNamaOpen })); },
    };
  }
}
</script>
</body>
</html>
