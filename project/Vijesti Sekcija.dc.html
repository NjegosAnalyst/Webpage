<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=Barlow:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  @keyframes riseIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="width:100%;background:#0a1120;font-family:'Barlow',sans-serif;padding:clamp(60px,7vw,110px) clamp(24px,4vw,64px)">
  <div style="max-width:1320px;margin:0 auto">

    <!-- section header -->
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:clamp(40px,4.5vw,64px);flex-wrap:wrap">
      <div>
        <div style="font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;letter-spacing:5px;color:var(--accent, #00B9F2);text-transform:uppercase;margin-bottom:16px">NOVOSTI</div>
        <h2 style="margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(34px,3.6vw,52px);line-height:1.02;letter-spacing:-.5px;color:#fff">Vijesti sa Jahorine</h2>
      </div>
      <a href="#" style="display:inline-flex;align-items:center;gap:9px;padding:14px 28px;background:transparent;color:#fff;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;letter-spacing:.3px;text-decoration:none;border:1.5px solid rgba(255,255,255,.35);border-radius:40px;white-space:nowrap;transition:background .2s,border-color .2s" style-hover="background:rgba(255,255,255,.1);border-color:#fff">
        Sve vijesti <span style="font-size:16px">→</span>
      </a>
    </div>

    <!-- news grid: featured + list -->
    <div style="display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(20px,2.2vw,32px);align-items:stretch">

      <!-- featured card -->
      <a href="{{ featured.href }}" style="position:relative;display:block;min-height:clamp(380px,38vw,560px);text-decoration:none;border-radius:22px;overflow:hidden;background:#111a2c;border:1px solid rgba(255,255,255,.08);animation:riseIn .7s cubic-bezier(.2,.7,.2,1) both">
        <div style="position:absolute;inset:0;overflow:hidden">
          <image-slot id="{{ featured.imgId }}" shape="rect" placeholder="{{ featured.placeholder }}" style="width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1)"></image-slot>
        </div>
        <div style="position:absolute;inset:0;background:linear-gradient(0deg, rgba(6,11,22,.92) 0%, rgba(6,11,22,.55) 42%, rgba(6,11,22,.05) 70%);pointer-events:none"></div>
        <span style="position:absolute;top:22px;left:22px;padding:8px 16px;background:var(--accent, #00B9F2);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;border-radius:40px;z-index:2">{{ featured.tag }}</span>
        <div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:14px;padding:clamp(24px,2.6vw,36px)">
          <div style="font-family:'Barlow',sans-serif;font-size:13px;font-weight:500;letter-spacing:.3px;color:rgba(255,255,255,.65)">{{ featured.date }}</div>
          <h3 style="margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(24px,2.1vw,31px);line-height:1.16;letter-spacing:-.3px;color:#fff;max-width:520px">{{ featured.title }}</h3>
          <p style="margin:0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.72);max-width:480px">{{ featured.excerpt }}</p>
          <span style="display:inline-flex;align-items:center;gap:8px;margin-top:4px;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;color:#fff">
            Pročitaj više <span style="font-size:16px;transition:transform .25s">→</span>
          </span>
        </div>
      </a>

      <!-- compact list -->
      <div style="display:flex;flex-direction:column;gap:clamp(16px,1.8vw,22px)">
        <sc-for list="{{ articles }}" as="article" hint-placeholder-count="2">
          <a href="{{ article.href }}" style="display:flex;gap:18px;flex:1;text-decoration:none;background:#111a2c;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s;animation:riseIn .7s cubic-bezier(.2,.7,.2,1) both" style-hover="transform:translateY(-4px);box-shadow:0 20px 40px -20px rgba(0,0,0,.6);border-color:rgba(255,255,255,.16)">

            <div style="position:relative;flex:0 0 clamp(110px,11vw,140px)">
              <div style="width:100%;height:100%;border-radius:12px;overflow:hidden">
                <image-slot id="{{ article.imgId }}" shape="rect" placeholder="{{ article.placeholder }}" style="width:100%;height:100%"></image-slot>
              </div>
              <span style="position:absolute;top:8px;left:8px;max-width:calc(100% + 40px);padding:5px 11px;background:var(--accent, #00B9F2);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;border-radius:40px;white-space:nowrap;z-index:2;pointer-events:none">{{ article.tag }}</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0">
              <div style="font-family:'Barlow',sans-serif;font-size:12.5px;font-weight:500;letter-spacing:.3px;color:rgba(255,255,255,.5)">{{ article.date }}</div>
              <h3 style="margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:16.5px;line-height:1.32;color:#fff">{{ article.title }}</h3>
              <span style="display:inline-flex;align-items:center;gap:6px;font-family:'Barlow',sans-serif;font-size:13.5px;font-weight:600;color:var(--accent, #00B9F2)">
                Pročitaj više <span style="font-size:14px">→</span>
              </span>
            </div>

          </a>
        </sc-for>
      </div>

    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 },
  &quot;articles&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{imgId:string,placeholder:string,tag:string,date:string,title:string,excerpt:string,href:string}&gt;&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const defaultArticles = [
      {
        imgId: 'vijest-1',
        placeholder: 'Slika: otvaranje sezone',
        tag: 'Sezona',
        date: '2. decembar 2026.',
        title: 'Zvanično otvorena zimska sezona 2026/27',
        excerpt: 'Prve staze su otvorene uz novi sistem za vještačko zasnježivanje i produženo noćno skijanje.',
        href: '#',
      },
      {
        imgId: 'vijest-2',
        placeholder: 'Slika: novi ski lift',
        tag: 'Infrastruktura',
        date: '18. novembar 2026.',
        title: 'Nova šestosjeda žičara puštena u rad',
        excerpt: 'Kapacitet prevoza skijaša povećan je za 40% uz skraćeno vrijeme čekanja na polaznoj stanici.',
        href: '#',
      },
      {
        imgId: 'vijest-3',
        placeholder: 'Slika: takmičenje',
        tag: 'Događaji',
        date: '5. novembar 2026.',
        title: 'Jahorina domaćin regionalnog FIS kupa',
        excerpt: 'Najbolji skijaši regiona takmiče se na olimpijskim stazama sredinom januara.',
        href: '#',
      },
    ];
    const all = this.props.articles ?? defaultArticles;
    return {
      featured: all[0],
      articles: all.slice(1),
    };
  }
}

</script>
</body>
</html>
