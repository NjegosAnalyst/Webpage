<!-- =====================================================================
     JAHORINA HEADER — WPCode: HTML Snippet → Auto Insert → Site Wide Body
     Sakriva stari Betheme header i prikazuje novi. Isključi snippet = vraća stari.
     ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* sakrij stari Betheme header i njegov bočni meni */
  #Top_bar, #Action_bar, .mfn-header-tmpl, #Side_slide, #body_overlay{display:none!important}
  .jh-wp, .jh-wp *, .jh-wp *::before, .jh-wp *::after{box-sizing:border-box}
  .jh-wp{line-height:normal;text-align:left}
  .jh-wp a{text-decoration:none!important}
  /* tema mijenja stil dugmadi i ikonica — zadrži naš izgled */
  .jh-wp button{font-family:inherit;letter-spacing:normal;text-transform:none;min-width:0;margin:0}
  .jh-wp .jf-round{padding:0!important;border:0!important;line-height:1!important;color:#fff!important}
  .jh-wp svg[fill="none"],.jh-wp svg[fill="none"] *:not([fill]){fill:none!important}
  .jh-wp svg [stroke="currentColor"]{stroke:currentColor!important}
  .jh-wp .jf-search button{padding:12px 22px!important;border:0!important;border-radius:40px!important;line-height:1!important}
  .jh-wp .jf-search input{height:44px;box-shadow:none!important;border:0!important;margin:0!important}
  .jh-wp{
    font-family:'Barlow',system-ui,sans-serif;color:#fff;
  }
  .jh-wp a{color:inherit}
  /* ================= HEADER ================= */
  .jf-header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:0 clamp(16px,3vw,44px);
    transition:background .35s ease,box-shadow .35s ease,backdrop-filter .35s ease;
  }
  .jf-header__inner{
    max-width:1440px;margin:0 auto;height:92px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;
    transition:height .35s ease;
  }
  /* poslije skrolovanja: tamno staklo umjesto bijele trake */
  .jf-header.is-scrolled{
    background:rgba(10,17,32,.72);
    -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 1px 0 rgba(255,255,255,.08),0 18px 40px -24px rgba(0,0,0,.8);
  }
  .jf-header.is-scrolled .jf-header__inner{height:70px}
  .jf-logo{justify-self:start;display:flex;align-items:center}
  .jf-logo img{height:46px;width:auto;display:block;transition:height .35s ease}
  .jf-header.is-scrolled .jf-logo img{height:38px}

  .jf-nav{display:flex;align-items:center;gap:clamp(18px,2.2vw,36px)}
  .jf-nav a{
    position:relative;font-size:16px;font-weight:500;color:rgba(255,255,255,.88);padding:6px 0;transition:color .2s;
  }
  .jf-nav a::after{
    content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#00B9F2,#fff,#00B9F2,transparent);
    box-shadow:0 0 10px rgba(0,185,242,.8);transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .jf-nav a:hover{color:#fff}
  .jf-nav a:hover::after,.jf-nav a[aria-current="page"]::after{transform:scaleX(1)}

  .jf-tools{justify-self:end;display:flex;align-items:center;gap:10px}
  .jf-nav a{line-height:1}

  /* pretraga: stakleno polje ispod headera */
  .jf-search{
    position:absolute;left:0;right:0;top:100%;padding:12px clamp(16px,3vw,44px) 18px;
    opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s;
  }
  .jh-wp.is-search-open .jf-search{opacity:1;transform:none;pointer-events:auto}
  .jf-search form{
    max-width:640px;margin:0 auto;display:flex;gap:10px;padding:6px;border-radius:40px;
    background:rgba(10,17,32,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:inset 3px 3px 8px rgba(0,0,0,.42),inset -3px -3px 7px rgba(78,104,150,.14),0 18px 40px -20px rgba(0,0,0,.8);
  }
  .jf-search input{flex:1;min-width:0;border:0;background:transparent;color:#fff;padding:0 18px;font:400 15.5px 'Barlow',sans-serif;outline:none}
  .jf-search input::placeholder{color:rgba(255,255,255,.42)}
  .jf-search button{border:0;cursor:pointer;padding:12px 22px;border-radius:40px;font:700 14.5px 'Barlow',sans-serif;color:#fff;
    background:linear-gradient(145deg,#2CCBF8,#00A6DB);box-shadow:0 8px 20px -8px rgba(0,185,242,.7),inset 1px 1px 0 rgba(255,255,255,.35)}
  .jf-round{
    width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(23,34,56,.75);color:#fff;box-shadow:4px 4px 10px rgba(0,0,0,.42),-3px -3px 9px rgba(78,104,150,.16),inset 1px 1px 0 rgba(255,255,255,.05);
    font:700 12.5px/1 'Archivo',sans-serif;letter-spacing:.6px;
    transition:color .2s,box-shadow .25s;
  }
  .jf-round:hover{color:#00B9F2}
  .jf-round:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.42),inset -3px -3px 7px rgba(78,104,150,.14)}
  .jf-burger{display:none}

  .jf-mnav{display:none}
  @media (max-width:1100px){
    .jf-nav{display:none}
    .jf-burger{display:inline-flex}
    .jf-header__inner{height:76px;display:flex;justify-content:space-between}
    .jf-logo img{height:40px}
    .jf-mnav{
      display:flex;flex-direction:column;gap:2px;
      position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
      padding:96px 18px 24px;background:#111a2c;box-shadow:-20px 0 60px rgba(0,0,0,.6);
      transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.7,.2,1);
    }
    .jf-mnav a{padding:15px 16px;border-radius:14px;font-size:17px;font-weight:500}
    .jf-mnav a:hover{box-shadow:inset 3px 3px 8px rgba(0,0,0,.42),inset -3px -3px 7px rgba(78,104,150,.14)}
    .jh-wp.is-menu-open .jf-mnav{transform:none}
    .jh-wp.is-menu-open .jf-header{z-index:130}   /* hamburger ostaje vidljiv da zatvori meni */
    .jf-shade{position:fixed;inset:0;z-index:110;background:rgba(4,8,18,.55);opacity:0;pointer-events:none;transition:opacity .3s}
    .jh-wp.is-menu-open .jf-shade{opacity:1;pointer-events:auto}
  }

  /* podmeni iz WordPressa (npr. O nama) */
  .jh-wp .jf-dd{position:relative;display:flex;align-items:center}
  .jh-wp .jf-dd__top::before{content:'';position:absolute;right:-14px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);opacity:.8}
  .jh-wp .jf-dd__top{margin-right:12px}
  .jh-wp .jf-dd__menu{position:absolute;top:calc(100% + 14px);left:-16px;min-width:220px;padding:8px;border-radius:18px;background:rgba(14,20,34,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 48px -16px rgba(0,0,0,.7);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .2s,transform .2s}
  .jh-wp .jf-dd:hover .jf-dd__menu,.jh-wp .jf-dd:focus-within .jf-dd__menu{opacity:1;transform:none;pointer-events:auto}
  .jh-wp .jf-dd__menu::before{content:'';position:absolute;left:0;right:0;top:-16px;height:16px}
  .jh-wp .jf-dd__menu a{display:block;padding:11px 14px;border-radius:12px;font-size:14.5px;color:rgba(255,255,255,.86)}
  .jh-wp .jf-dd__menu a::after{display:none}
  .jh-wp .jf-dd__menu a:hover{color:#fff;background:rgba(255,255,255,.07)}
  .jh-wp .jf-mnav a.jf-mnav__sub{padding:10px 16px 10px 32px;font-size:15px;color:rgba(255,255,255,.7)}
  body.admin-bar .jf-header{top:32px}
  @media (max-width:782px){ body.admin-bar .jf-header{top:46px} }
  @media (prefers-reduced-motion:reduce){.jh-wp *{transition:none!important}}
</style>
<div class="jf jh-wp">
  <header class="jf-header">
    <div class="jf-header__inner">
      <a href="https://www.oc-jahorina.com/" class="jf-logo"><img src="https://oc-jahorina.com/wp-content/uploads/2026/09/logo-white-lockup.png" alt="Jahorina — Olimpijski centar"></a>
      <nav class="jf-nav" aria-label="Glavni meni">
        <a href="https://www.oc-jahorina.com/o-nama/">O nama</a>
        <a href="https://www.oc-jahorina.com/cjenovnik/">Cjenovnik</a>
        <a href="https://www.oc-jahorina.com/vijesti/">Vijesti</a>
        <a href="https://www.oc-jahorina.com/foto-galerija/">Foto galerija</a>
        <a href="https://www.oc-jahorina.com/video-galerija/">Video galerija</a>
      </nav>
      <div class="jf-tools">
        <button type="button" class="jf-round jf-search-btn" aria-label="Pretraga" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M16 16 L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <a href="https://www.oc-jahorina.com/en/" class="jf-round jf-lang" aria-label="English">EN</a>
        <button type="button" class="jf-round jf-burger" aria-label="Otvori meni" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="jf-search">
      <form action="https://www.oc-jahorina.com/" method="get" role="search">
        <label for="jf-s" style="position:absolute;left:-9999px">Pretraga</label>
        <input id="jf-s" type="search" name="s" placeholder="Pretraži sajt…" autocomplete="off">
        <button type="submit">Traži</button>
      </form>
    </div>
  </header>
  <div class="jf-shade"></div>
  <nav class="jf-mnav" aria-label="Meni za telefon">
    <a href="https://www.oc-jahorina.com/o-nama/">O nama</a>
    <a href="https://www.oc-jahorina.com/cjenovnik/">Cjenovnik</a>
    <a href="https://www.oc-jahorina.com/vijesti/">Vijesti</a>
    <a href="https://www.oc-jahorina.com/foto-galerija/">Foto galerija</a>
    <a href="https://www.oc-jahorina.com/video-galerija/">Video galerija</a>
  </nav>
</div>
<script>
function jhInit() {
  var root = document.querySelector('.jh-wp');
  if (!root) return;
  // header uvijek ide na sam početak stranice, bez obzira gdje ga WPCode ubaci
  function toTop() { if (document.body && document.body.firstChild !== root) document.body.insertBefore(root, document.body.firstChild); }
  toTop(); document.addEventListener('DOMContentLoaded', toTop);

  var header = root.querySelector('.jf-header');
  function onScroll() { header.classList.toggle('is-scrolled', window.scrollY > 40 || root.classList.contains('is-search-open')); }
  onScroll(); window.addEventListener('scroll', onScroll, { passive: true });

  var burger = root.querySelector('.jf-burger'), shade = root.querySelector('.jf-shade');
  function setMenu(open) { root.classList.toggle('is-menu-open', open); burger.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  burger.addEventListener('click', function () { setMenu(!root.classList.contains('is-menu-open')); });
  shade.addEventListener('click', function () { setMenu(false); });

  var sBtn = root.querySelector('.jf-search-btn'), sInput = root.querySelector('.jf-search input');
  function setSearch(open) {
    root.classList.toggle('is-search-open', open); sBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    onScroll(); if (open) setTimeout(function () { sInput.focus(); }, 60);
  }
  sBtn.addEventListener('click', function (e) { e.stopPropagation(); setSearch(!root.classList.contains('is-search-open')); });
  document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('.jf-header')) setSearch(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { setSearch(false); setMenu(false); } });

  // ===== MENI IZ WORDPRESSA: stavke se čitaju iz postojećeg Betheme menija =====
  // (Izgled → Izbornici ostaje jedino mjesto gdje se meni uređuje)
  var srcUl = document.querySelector('#Top_bar #menu > ul, #Top_bar .menu_wrapper ul.menu, .mfn-header-tmpl nav ul, #menu-main-menu');
  var fromWP = false;
  if (srcUl) {
    var items = [].filter.call(srcUl.children, function (li) { return li.tagName === 'LI' && li.querySelector('a'); });
    if (items.length) {
      fromWP = true;
      var nav = root.querySelector('.jf-nav'), mnav = root.querySelector('.jf-mnav');
      nav.innerHTML = ''; mnav.innerHTML = '';
      items.forEach(function (li) {
        var a0 = li.querySelector('a'), label = (a0.textContent || '').replace(/\s+/g, ' ').trim();
        if (!label) return;
        var sub = li.querySelector(':scope > ul');
        var link = document.createElement('a'); link.href = a0.href; link.textContent = label;
        if (a0.target) link.target = a0.target;
        if (/current-menu-(item|ancestor|parent)/.test(li.className)) link.setAttribute('aria-current', 'page');
        var mlink = link.cloneNode(true); mnav.appendChild(mlink);
        if (sub) {
          var wrap = document.createElement('div'); wrap.className = 'jf-dd';
          var box = document.createElement('div'); box.className = 'jf-dd__menu';
          [].forEach.call(sub.querySelectorAll(':scope > li > a'), function (sa) {
            var x = document.createElement('a'); x.href = sa.href; x.textContent = sa.textContent.replace(/\s+/g, ' ').trim();
            if (sa.target) x.target = sa.target;
            box.appendChild(x);
            var mx = x.cloneNode(true); mx.className = 'jf-mnav__sub'; mnav.appendChild(mx);
          });
          link.classList.add('jf-dd__top');
          wrap.appendChild(link); wrap.appendChild(box); nav.appendChild(wrap);
        } else nav.appendChild(link);
      });
    }
  }
  root.classList.add('is-ready');   // tek sada pokaži meni (bez treptaja pogrešnih stavki)
  // jezik iz WordPressa (WPML / Polylang), ako postoji
  var wpLang = document.querySelector('#Top_bar .wpml-languages a:not(.active), #Top_bar a[hreflang], .lang-item:not(.current-lang) a');

  // jezik: na srpskoj strani dugme "EN" vodi na istu stranicu na engleskom, i obrnuto
  var path = location.pathname, isEN = /^\/en(\/|$)/.test(path);
  var lang = root.querySelector('.jf-lang');
  lang.href = wpLang ? wpLang.href : location.origin + (isEN ? (path.replace(/^\/en/, '') || '/') : '/en' + path);
  lang.textContent = isEN ? 'SR' : 'EN';
  lang.setAttribute('aria-label', isEN ? 'Srpski' : 'English');
  if (!isEN) return;
  if (fromWP) {   // meni je već na pravom jeziku iz WordPressa — prevedi samo pretragu
    var f0 = root.querySelector('.jf-search form');
    f0.action = 'https://www.oc-jahorina.com/en/'; sInput.placeholder = 'Search the site…';
    f0.querySelector('button').textContent = 'Search'; sBtn.setAttribute('aria-label', 'Search');
    return;
  }
  var T = { 'O nama': 'About us', 'Cjenovnik': 'Pricelist', 'Vijesti': 'News', 'Foto galerija': 'Photo gallery', 'Video galerija': 'Video gallery' };
  root.querySelectorAll('.jf-nav a, .jf-mnav a').forEach(function (a) {
    var t = a.textContent.trim(); if (T[t]) a.textContent = T[t];
  });
  root.querySelectorAll('a[href^="https://www.oc-jahorina.com/"]').forEach(function (a) {
    if (a !== lang && !/oc-jahorina\.com\/en\//.test(a.href)) a.href = a.href.replace('oc-jahorina.com/', 'oc-jahorina.com/en/');
  });
  var f = root.querySelector('.jf-search form');
  f.action = 'https://www.oc-jahorina.com/en/';
  sInput.placeholder = 'Search the site…';
  f.querySelector('button').textContent = 'Search';
  sBtn.setAttribute('aria-label', 'Search');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', jhInit); else jhInit();
</script>
