<title>Mapa staza Jahorine</title>
<style>
  :root { --bg: #0A1120; --fg: #ffffff; --muted: rgba(255,255,255,.55); --line: rgba(255,255,255,.08); --accent: #00B9F2; color-scheme: dark; }
  html, body { background: var(--bg); color: var(--fg); }
  .pv-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); font: 500 13px/1.3 "Barlow", system-ui, sans-serif; color: var(--muted); }
  .pv-top strong { font: 600 11px/1 "Archivo", system-ui, sans-serif; letter-spacing: 4px; text-transform: uppercase; color: var(--fg); }
  .pv-lang { display: inline-flex; padding: 3px; border-radius: 30px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px var(--line); }
  .pv-lang button { all: unset; cursor: pointer; min-width: 44px; height: 34px; padding: 0 10px; box-sizing: border-box; display: grid; place-items: center; border-radius: 30px; font: 600 12px/1 "Archivo", system-ui, sans-serif; letter-spacing: 1.5px; color: var(--muted); }
  .pv-lang button[aria-pressed="true"] { color: var(--fg); background: rgba(0,185,242,.16); box-shadow: inset 0 0 0 1px rgba(0,185,242,.5); }
  .pv-lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<div class="pv-top">
  <span><strong>Pregled</strong>&nbsp;&nbsp;sekcija za oc-jahorina.com</span>
  <span class="pv-lang" role="group" aria-label="Jezik">
    <button type="button" id="pv-sr" aria-pressed="true">SR</button>
    <button type="button" id="pv-en" aria-pressed="false">EN</button>
  </span>
</div>
<div id="jm-mapa" data-lang="sr"></div>
<script src="mapa.js"></script>
<script>
  (function () {
    function mount(lang) {
      var old = document.getElementById('jm-mapa');
      var el = document.createElement('div'); el.id = 'jm-mapa'; el.setAttribute('data-lang', lang);
      old.parentNode.replaceChild(el, old);
      var s = document.createElement('script'); s.src = 'mapa.js?' + lang + Date.now(); document.body.appendChild(s);
      document.getElementById('pv-sr').setAttribute('aria-pressed', lang === 'sr');
      document.getElementById('pv-en').setAttribute('aria-pressed', lang === 'en');
    }
    document.getElementById('pv-sr').onclick = function () { mount('sr'); };
    document.getElementById('pv-en').onclick = function () { mount('en'); };
  })();
</script>
